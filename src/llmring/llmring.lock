models = [ "anthropic:claude-haiku-4-5", "openai:gpt-5-nano", "google:gemini-2.5-flash-lite",]

[profiles.prod]
name = "prod"
[[profiles.prod.bindings]]
alias = "advisor"
models = [ "anthropic:claude-opus-5", "openai:gpt-5", "google:gemini-2.5-pro",]

[profiles.test]
name = "test"
[[profiles.test.bindings]]
alias = "advisor"
models = [ "openai:gpt-5-nano",]

[profiles.default.registry_versions]

